name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Generate synthetic data
        run: python data/generate_data.py
      - name: Unit, property and evaluation tests
        run: pytest -m "not db" -q
      - name: Evaluation report
        run: python scripts/evaluate.py
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-report
          path: reports/

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apguard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APGUARD_TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/apguard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python data/generate_data.py
      - name: Database, pipeline, workflow and API tests
        run: pytest -m db -v
